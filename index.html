<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiŠkola AI | Svo Gradivo 1-8</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --accent: #ec4899; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR - Razredi */
        .sidebar { width: 280px; background: #020617; border-right: 1px solid #334155; padding: 30px 20px; display: flex; flex-direction: column; gap: 10px; }
        .sidebar h2 { font-weight: 800; color: var(--primary); font-size: 1.5rem; margin-bottom: 20px; letter-spacing: -1px; }
        .class-btn { background: var(--card); border: 1px solid transparent; color: #94a3b8; padding: 15px; border-radius: 12px; cursor: pointer; text-align: left; font-weight: 600; }
        .class-btn:hover, .class-btn.active { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; transform: scale(1.03); border-color: white; }

        /* GLAVNI DIO */
        .main { flex: 1; padding: 40px; overflow-y: auto; background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.05), transparent); }
        .welcome-screen { text-align: center; margin-top: 10vh; }
        .welcome-screen h1 { font-size: 3.5rem; margin-bottom: 10px; }
        
        .subject-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .subject-card { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid #334155; }
        .subject-card h3 { color: var(--primary); margin-top: 0; font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
        
        .lesson-link { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; margin-top: 10px; cursor: pointer; border-left: 4px solid var(--accent); }
        .lesson-link:hover { background: rgba(255,255,255,0.1); padding-left: 20px; }

        /* VIEWER LEKCIJE */
        #viewer { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 1000; padding: 60px 10%; overflow-y: auto; }
        .viewer-box { max-width: 900px; margin: 0 auto; background: var(--card); padding: 40px; border-radius: 30px; border: 1px solid var(--primary); box-shadow: 0 0 50px rgba(99, 102, 241, 0.2); }
        .close-btn { background: #ef4444; color: white; border: none; padding: 10px 25px; border-radius: 10px; cursor: pointer; font-weight: 800; margin-bottom: 20px; }
        
        /* AI CHAT */
        #ai-trigger { position: fixed; bottom: 30px; right: 30px; width: 70px; height: 70px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 2000; }
        #ai-chat { position: fixed; bottom: 110px; right: 30px; width: 380px; height: 500px; background: #fff; color: #1e293b; border-radius: 25px; display: none; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); z-index: 2000; }
        .ai-header { background: #1e293b; color: white; padding: 20px; font-weight: 800; display: flex; justify-content: space-between; }
        .ai-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; font-size: 0.95rem; }
        .ai-footer { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        .ai-footer input { flex: 1; border: 1px solid #ddd; padding: 12px; border-radius: 10px; outline: none; }
        
        /* Stilovi za lekcije */
        .formula { background: #0f172a; color: var(--primary); padding: 20px; border-radius: 15px; text-align: center; font-size: 1.8rem; margin: 20px 0; font-family: monospace; }
        .example-box { background: #f1f5f9; border-left: 5px solid var(--accent); color: #1e293b; padding: 20px; border-radius: 10px; margin: 20px 0; font-style: italic; }
        .must-know { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 15px; border-radius: 10px; margin: 20px 0; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>WIKI-ŠKOLA AI</h2>
    <button class="class-btn" onclick="showClass(1)">1. RAZRED</button>
    <button class="class-btn" onclick="showClass(2)">2. RAZRED</button>
    <button class="class-btn" onclick="showClass(5)">5. RAZRED</button>
    <button class="class-btn" onclick="showClass(7)">7. RAZRED</button>
    <button class="class-btn" onclick="showClass(8)">8. RAZRED</button>
    <div style="margin-top:auto; font-size: 0.8rem; opacity: 0.5;">v2.0 Integrirani AI Mozak</div>
</div>

<div class="main">
    <div id="welcome" class="welcome-screen">
        <h1>Bok! Što ćemo danas <span style="color:var(--primary)">učiti?</span></h1>
        <p>Odaberi razred s lijeve strane ili pitaj AI asistenta za pomoć.</p>
    </div>
    <div id="subjectGrid" class="subject-grid"></div>
</div>

<div id="viewer">
    <div class="viewer-box">
        <button class="close-btn" onclick="closeLekcija()">ZATVORI [X]</button>
        <div id="lessonContent"></div>
    </div>
</div>

<div id="ai-trigger" onclick="toggleChat()">🤖</div>
<div id="ai-chat">
    <div class="ai-header">Wiki Mozak AI <span>● online</span></div>
    <div class="ai-body" id="chatLog">
        <div style="background:#f1f5f9; padding:12px; border-radius:15px; align-self: flex-start;">Zdravo! Ja sam Wiki Mozak. Pitaj me bilo što iz gradiva osnovne škole!</div>
    </div>
    <div class="ai-footer">
        <input type="text" id="aiInput" placeholder="Napiši pitanje...">
        <button onclick="aiAsk()" style="background:var(--primary); color:white; border:none; padding:10px 15px; border-radius:10px; cursor:pointer;">➔</button>
    </div>
</div>

<script>
const GRADIVO = {
    1: {
        'Hrvatski': [
            { t: 'Velika i mala slova', c: '<h1>Abeceda i rečenice</h1><p>U 1. razredu učimo pisati sva slova. Zapamti: <b>rečenica uvijek počinje velikim slovom</b>.</p><div class="must-know"><b>Što trebaš znati:</b> Prepoznati svako slovo i znati staviti točku na kraj rečenice.</div><div class="example-box"><b>Primjer:</b> <u>M</u>ama kuha ručak<u>.</u> (M je veliko, na kraju je točka).</div>' }
        ],
        'Matematika': [
            { t: 'Zbrajanje do 10', c: '<h1>Zbrajanje</h1><p>Zbrajanje je kada spajamo dvije skupine predmeta u jednu veću.</p><div class="formula">5 + 2 = 7</div><div class="example-box"><b>Primjer:</b> Ako imaš 3 jabuke i dobiješ još 2, ukupno imaš 5 jabuka.</div>' }
        ]
    },
    5: {
        'Povijest': [
            { t: 'Stari Egipat', c: '<h1>Egipat - dar Nila</h1><p>Egipat se razvio uz rijeku Nil. Poznati su po piramidama i faraonima.</p><div class="must-know"><b>Što trebaš znati:</b> Piramide su grobnice, Nil je omogućio život, pisali su hijeroglifima.</div>' }
        ],
        'Geografija': [
            { t: 'Zemlja i Svemir', c: '<h1>Zemlja</h1><p>Zemlja je 3. planet od Sunca. Ima jedan prirodni satelit - Mjesec.</p><div class="example-box"><b>Primjer:</b> Zemlji treba 365 dana da obiđe oko Sunca (godina).</div>' }
        ]
    },
    7: {
        'Fizika': [
            { t: 'Gustoća tvari', c: '<h1>Gustoća (ρ)</h1><p>Gustoća nam govori koliko je tvari zbijeno u nekom prostoru.</p><div class="formula">ρ = m / V</div><div class="must-know"><b>Što trebaš znati:</b> m je masa (kg), V je volumen (m3). Ako je tijelo gušće od vode, ono tone.</div>' }
        ],
        'Biologija': [
            { t: 'Stanica', c: '<h1>Građa stanice</h1><p>Stanica je osnovna jedinica života. Postoje biljne i životinjske stanice.</p><div class="example-box"><b>Primjer:</b> Biljna stanica ima kloroplaste (za fotosintezu) i stijenku, dok životinjska nema.</div>' }
        ]
    },
    8: {
        'Kemija': [
            { t: 'Atomi i elementi', c: '<h1>Građa atoma</h1><p>Atom se sastoji od jezgre (protoni, neutroni) i omotača (elektroni).</p><div class="must-know"><b>Što trebaš znati:</b> Protoni su +, elektroni -, neutroni neutralni. Redni broj u PSE je broj protona.</div>' }
        ],
        'Matematika': [
            { t: 'Pitagorin poučak', c: '<h1>Pravokutni trokut</h1><p>Kvadrat nad hipotenuzom jednak je zbroju kvadrata nad katetama.</p><div class="formula">a² + b² = c²</div>' }
        ]
    }
};

function showClass(r) {
    document.getElementById('welcome').style.display = 'none';
    const grid = document.getElementById('subjectGrid');
    grid.innerHTML = "";
    
    document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    const predmeti = GRADIVO[r];
    for (let p in predmeti) {
        let card = `<div class="subject-card"><h3>📚 ${p}</h3>`;
        predmeti[p].forEach((l, i) => {
            card += `<div class="lesson-link" onclick="openL(${r}, '${p}', ${i})">${l.t}</div>`;
        });
        card += `</div>`;
        grid.innerHTML += card;
    }
}

function openL(r, p, i) {
    document.getElementById('lessonContent').innerHTML = GRADIVO[r][p][i].c;
    document.getElementById('viewer').style.display = 'block';
}

function closeLekcija() { document.getElementById('viewer').style.display = 'none'; }

function toggleChat() {
    const chat = document.getElementById('ai-chat');
    chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
}

function aiAsk() {
    const q = document.getElementById('aiInput').value.toLowerCase();
    const log = document.getElementById('chatLog');
    if(!q) return;

    log.innerHTML += `<div style="background:var(--primary); color:white; padding:12px; border-radius:15px; align-self: flex-end;">${q}</div>`;
    
    let a = "To je odlično pitanje! Nažalost, to gradivo još učim. Pokušaj me pitati za Padeže, Pitagoru ili Atome!";
    if(q.includes("padež")) a = "Padeža ima 7: Nominativ (Tko? Što?), Genitiv (Koga? Čega?), Dativ (Komu? Čemu?), Akuzativ (Koga? Što?), Vokativ (Oj!), Lokativ (O kome?), Instrumental (S kime?).";
    if(q.includes("pitagora")) a = "Pitagorin poučak glasi: a² + b² = c². Koristi se samo na pravokutnom trokutu!";
    if(q.includes("8x7") || q.includes("8*7")) a = "8 puta 7 je 56! Tablica množenja je zakon.";
    if(q.includes("sila")) a = "Sila (F) je masa (m) puta ubrzanje (a). Formula je F = m * a. Mjeri se u Njutnima (N).";

    setTimeout(() => {
        log.innerHTML += `<div style="background:#e2e8f0; padding:12px; border-radius:15px; align-self: flex-start;"><b>AI Mozak:</b> ${a}</div>`;
        log.scrollTop = log.scrollHeight;
    }, 600);
    document.getElementById('aiInput').value = "";
}
</script>
</body>
</html>
