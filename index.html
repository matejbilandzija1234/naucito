<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>WikiŠkola | Sva gradiva 1.-8. razred</title>
    <style>
        :root { --p: #0066ff; --bg: #f4f7f6; --txt: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; background: var(--bg); color: var(--txt); height: 100vh; }
        
        /* Lijevi izbornik - RAZREDI */
        .sidebar { width: 220px; background: #1a1c23; color: white; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .sidebar h2 { font-size: 1.2rem; color: var(--p); border-bottom: 1px solid #333; padding-bottom: 10px; }
        .class-btn { padding: 12px; background: #2a2d37; border: none; color: white; border-radius: 8px; cursor: pointer; text-align: left; font-weight: bold; }
        .class-btn:hover, .class-btn.active { background: var(--p); }

        /* Sredina - PREDMETI I LEKCIJE */
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .header-info { margin-bottom: 30px; }
        .subject-box { background: white; border-radius: 15px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .subject-title { font-size: 1.4rem; font-weight: 800; color: var(--p); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        
        .lesson-link { display: block; padding: 10px; border-bottom: 1px solid #eee; text-decoration: none; color: #444; cursor: pointer; transition: 0.2s; }
        .lesson-link:hover { background: #f0f7ff; color: var(--p); padding-left: 20px; }

        /* Puna lekcija preko ekrana */
        #viewer { display: none; position: fixed; inset: 0; background: white; z-index: 1000; padding: 60px; overflow-y: auto; }
        .viewer-content { max-width: 800px; margin: 0 auto; line-height: 1.8; font-size: 1.2rem; }
        .close-btn { position: fixed; top: 20px; right: 40px; background: #ff4757; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        .highlight { background: #fff3cd; padding: 2px 5px; border-radius: 3px; font-weight: bold; }
        .formula { display: block; text-align: center; font-size: 1.8rem; background: #f8f9fa; padding: 20px; border: 1px dashed var(--p); margin: 20px 0; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>RAZREDI</h2>
    <button class="class-btn active" onclick="prikaziRazred(1)">1. RAZRED</button>
    <button class="class-btn" onclick="prikaziRazred(2)">2. RAZRED</button>
    <button class="class-btn" onclick="prikaziRazred(3)">3. RAZRED</button>
    <button class="class-btn" onclick="prikaziRazred(4)">4. RAZRED</button>
    <button class="class-btn" onclick="prikaziRazred(5)">5. RAZRED</button>
    <button class="class-btn" onclick="prikaziRazred(6)">6. RAZRED</button>
    <button class="class-btn" onclick="prikaziRazred(7)">7. RAZRED</button>
    <button class="class-btn" onclick="prikaziRazred(8)">8. RAZRED</button>
</div>

<div class="main">
    <div class="header-info">
        <h1 id="razredNaslov">1. Razred Osnovne Škole</h1>
        <p>Popis svih predmeta i gradiva prema nacionalnom kurikulumu.</p>
    </div>
    <div id="predmetiContainer"></div>
</div>

<div id="viewer">
    <div class="viewer-content">
        <button class="close-btn" onclick="zatvori()">ZATVORI X</button>
        <div id="lekcijaSadrzaj"></div>
    </div>
</div>

<script>
const bazaZnanja = {
    1: {
        'Hrvatski jezik': [
            { t: 'Veliko i malo tiskano slovo', c: '<h1>Slova abecede</h1><p>U prvom razredu učimo pisati sva velika i mala slova. <span class="highlight">Rečenica uvijek počinje velikim slovom!</span></p>' },
            { t: 'Rastavljanje riječi na slogove', c: '<h1>Slogovi</h1><p>Riječ "MAMA" ima dva sloga: MA-MA. Riječ "ŠKOLA" ima dva sloga: ŠKO-LA.</p>' }
        ],
        'Matematika': [
            { t: 'Brojevi do 20', c: '<h1>Zbrajanje i oduzimanje</h1><p>Učimo zbrajati unutar prve desetice, a zatim i do 20.</p><div class="formula">5 + 3 = 8</div>' },
            { t: 'Geometrijska tijela i likovi', c: '<h1>Likovi</h1><p>Kvadrat, krug, trokut i pravokutnik.</p>' }
        ],
        'Priroda i društvo': [
            { t: 'Škola i dom', c: '<h1>Ponašanje u školi</h1><p>Učimo put od kuće do škole i kako se ponašati u razredu.</p>' }
        ]
    },
    5: {
        'Hrvatski jezik': [
            { t: 'Promjenjive i nepromjenjive riječi', c: '<h1>Vrste riječi</h1><p>Imenice, glagoli i pridjevi mijenjaju svoj oblik.</p>' }
        ],
        'Matematika': [
            { t: 'Razlomci - uvod', c: '<h1>Što je razlomak?</h1><p>Razlomak označava dio cjeline.</p><div class="formula">1 / 2 (polovica)</div>' },
            { t: 'Skupovi brojeva', c: '<h1>Prirodni brojevi</h1><p>Skup N = {1, 2, 3, 4, ...}</p>' }
        ],
        'Povijest': [
            { t: 'Lenta vremena i računanje vremena', c: '<h1>Povijest</h1><p>Učimo o erama: prije nove ere i nove ere.</p>' }
        ],
        'Geografija': [
            { t: 'Zemlja u svemiru', c: '<h1>Planeti</h1><p>Zemlja je treći planet od Sunca.</p>' }
        ]
    },
    7: {
        'Fizika': [
            { t: 'Tijela i tvari', c: '<h1>Fizika uvod</h1><p>Sve oko nas je tvar i zauzima prostor.</p>' },
            { t: 'Gustoća tvari', c: '<h1>Gustoća</h1><div class="formula">rho = m / V</div>' }
        ],
        'Kemija': [
            { t: 'Kemijske promjene', c: '<h1>Promjene tvari</h1><p>Fizikalne (promjena oblika) i Kemijske (nastaje nešto novo).</p>' }
        ]
    }
    // Ovdje možemo dopisati 2, 3, 4, 6, 8 razred na isti način
};

function prikaziRazred(r) {
    // Označi aktivni gumb
    document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    document.getElementById('razredNaslov').innerText = r + ". Razred Osnovne Škole";
    const container = document.getElementById('predmetiContainer');
    container.innerHTML = "";

    const predmeti = bazaZnanja[r];
    if(!predmeti) {
        container.innerHTML = "<p>Gradivo za ovaj razred se trenutno učitava u bazu...</p>";
        return;
    }

    for (let predmet in predmeti) {
        let box = `<div class="subject-box"><div class="subject-title">📘 ${predmet}</div>`;
        predmeti[predmet].forEach((lekcija, index) => {
            box += `<div class="lesson-link" onclick="otvoriLekciju(${r}, '${predmet}', ${index})">${lekcija.t}</div>`;
        });
        box += `</div>`;
        container.innerHTML += box;
    }
}

function otvoriLekciju(r, p, i) {
    const lekcija = bazaZnanja[r][p][i];
    document.getElementById('lekcijaSadrzaj').innerHTML = lekcija.c;
    document.getElementById('viewer').style.display = 'block';
}

function zatvori() {
    document.getElementById('viewer').style.display = 'none';
}

// Početno učitaj 1. razred
window.onload = () => prikaziRazred(1);
</script>

</body>
</html>
