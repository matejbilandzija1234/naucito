<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>WIKI-ŠKOLA | SVEUKUPNO ZNANJE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #00d2ff; --bg: #0a0f1d; --card: #161e2d; --text: #ffffff; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .hero { background: linear-gradient(rgba(10,15,29,0.8), rgba(10,15,29,0.8)), url('https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&q=80&w=1200'); background-size: cover; padding: 120px 5%; text-align: center; border-bottom: 2px solid var(--p); }
        .hero h1 { font-size: 5rem; margin: 0; font-weight: 800; letter-spacing: -3px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 60px 10%; }
        .main-btn { background: var(--card); padding: 50px; border-radius: 30px; text-align: center; border: 1px solid #222; transition: 0.4s; cursor: pointer; text-decoration: none; color: white; display: block; }
        .main-btn:hover { transform: translateY(-15px); border-color: var(--p); box-shadow: 0 20px 40px rgba(0,210,255,0.3); }
        .ai-fab { position: fixed; bottom: 30px; right: 30px; background: var(--p); width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; cursor: pointer; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="hero">
        <h1>WIKI<span style="color:var(--p)">ŠKOLA</span></h1>
        <p>Apsolutno svaka lekcija. Svaki razred. Svaki predmet.</p>
    </div>
    <div class="grid">
        <a href="nizi.html" class="main-btn"><h2>🧒 1. - 4. RAZRED</h2><p>Osnove, slova, brojevi i priroda.</p></a>
        <a href="visi.html" class="main-btn"><h2>🧑‍🎓 5. - 8. RAZRED</h2><p>Fizika, Kemija, Biologija, Povijest...</p></a>
    </div>
    <div class="ai-fab" onclick="alert('AI Asistent: Pitaj me bilo što iz gradiva!')">🤖</div>
</body>
</html>
